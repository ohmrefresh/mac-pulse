name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version          # the runner's toolchain drifts; a type-check failure here needs to name it

      - name: Package tests
        run: swift test --package-path Packages/MacPulseKit

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: App build and tests
        run: |
          xcodegen generate
          xcodebuild -project MacPulse.xcodeproj -scheme MacPulse \
            -destination "platform=macOS" -derivedDataPath .build/xcode test

      # Timing on shared runners is noisy, so budgets are reported but do not fail the build.
      - name: Collector benchmarks (informational)
        continue-on-error: true
        run: PULSE_BENCH=1 swift test -c release --package-path Packages/MacPulseKit --filter CollectorBenchmarks

  # A pushed vX.Y.Z tag publishes the DMG, only once the tests above pass on that commit.
  # project.yml is the version's source of truth: bump MARKETING_VERSION and add a CHANGELOG
  # section first, then tag. Signing and notarization switch on when their secrets exist.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      DEVELOPER_ID_NAME: ${{ secrets.DEVELOPER_ID }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # package.sh numbers the build by commit count

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check version and release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT="$(awk -F'"' '/MARKETING_VERSION/ { print $2; exit }' project.yml)"
          if [[ "$VERSION" != "$PROJECT" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION \"$PROJECT\" in project.yml. Bump project.yml, then tag."
            exit 1
          fi
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section to use as release notes."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up signing
        if: env.DEVELOPER_ID_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "DEVELOPER_ID=$DEVELOPER_ID_NAME" >> "$GITHUB_ENV"
          if [[ -n "$NOTARY_KEY_P8_BASE64" && -n "$NOTARY_KEY_ID" && -n "$NOTARY_ISSUER_ID" ]]; then
            echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials macpulse --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$KEYCHAIN"
            rm -f "$RUNNER_TEMP/notary.p8"
            echo "NOTARY_PROFILE=macpulse" >> "$GITHUB_ENV"
          fi

      - name: Package
        run: |
          scripts/package.sh
          if [[ -z "${DEVELOPER_ID:-}" ]]; then
            printf '\n---\n\nThis build is ad-hoc signed and not notarized: macOS will block the first launch. Right-click Mac Pulse in Applications and choose Open.\n' >> notes.md
          elif [[ -z "${NOTARY_PROFILE:-}" ]]; then
            printf '\n---\n\nThis build is signed but not notarized: macOS will warn on first launch. Right-click Mac Pulse in Applications and choose Open.\n' >> notes.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x releases come before v1.0, the first public release.
          if [[ "$VERSION" == 0.* ]]; then PRERELEASE=--prerelease; else PRERELEASE=; fi
          gh release create "$GITHUB_REF_NAME" "dist/MacPulse-$VERSION.dmg" \
            --title "Mac Pulse $VERSION" --notes-file notes.md --verify-tag $PRERELEASE

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
