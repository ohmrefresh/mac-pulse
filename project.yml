name: MacPulse
options:
  bundleIdPrefix: com.ohmrefresh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MacPulseKit:
    path: Packages/MacPulseKit
targets:
  MacPulse:
    type: application
    platform: macOS
    sources: [App/Sources, App/Resources]
    scheme:
      testTargets: [MacPulseTests]
    dependencies:
      - package: MacPulseKit
        product: PulseEngine
      - package: MacPulseKit
        product: PulseStore
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Mac Pulse
        LSApplicationCategoryType: public.app-category.utilities
        # Without these XcodeGen writes 1.0 / 1 and MARKETING_VERSION never reaches the app.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ohmrefresh.macpulse
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MacPulseTests:
    type: bundle.unit-test
    platform: macOS
    sources: [App/Tests]
    dependencies:
      - target: MacPulse
      - package: MacPulseKit
        product: PulseEngine
      - package: MacPulseKit
        product: PulseStore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ohmrefresh.macpulse.tests
        CODE_SIGN_IDENTITY: "-"
